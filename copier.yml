# copier template for a ReD sub-project. `rail new` drives it; `rail upgrade` is `copier update`.
# The template files live under template/project; this file must sit at the repository root.
_min_copier_version: "9.0.0"
_subdirectory: template/project
_answers_file: .copier-answers.yml
_templates_suffix: .jinja

project:
  type: str
  help: Project slug (red-<name>, kebab-case)
  validator: >-
    {% if not (project | regex_search('^red-[a-z0-9]+(-[a-z0-9]+)*$')) %}
    project must match red-<kebab-case>
    {% endif %}
description:
  type: str
  help: One sentence — what the project does
brain_key:
  type: str
  default: "{{ project }}"
  help: brain-v42 project key (group red)
tier:
  type: str
  choices: [bootstrap, dev, prod]
  default: bootstrap
  help: Maturity tier the project is scored against
stack:
  type: str
  choices: [python, go, docs]
  default: python
rail_ref:
  type: str
  default: main
  help: >-
    Ref of hawkixs/red-rail the reusable CI workflow is called at. `rail new` and
    `rail upgrade` resolve a commit SHA here, so the gates guarding this repository
    change only when a commit in this repository says so.

deploy_target:
  type: str
  choices: [vps-traefik, private-compose, private-systemd]
  default: vps-traefik
  when: "{{ tier == 'prod' }}"
  help: Where it lands — the border VPS behind Traefik, or a machine with no public route
  validator: >-
    {% if deploy_target == 'private-systemd' %}
    private-systemd is written by hand: rail.yaml needs deploy.unit and deploy.binary
    {% endif %}
healthcheck:
  type: str
  # A private target has no public route and no guessable default: like `deploy.bind_address`,
  # the address is something the operator states, never something the template assumes. No
  # machine address is written down here.
  default: "{% if deploy_target in ['private-compose', 'private-systemd'] %}{% else %}https://{{ project[4:] }}.hawkixs.com/healthz{% endif %}"
  when: "{{ tier == 'prod' }}"
  validator: >-
    {% if not (healthcheck | regex_search('^https?://..*')) %}
    healthcheck must be an http(s) URL with a host
    {% endif %}
ledger:
  type: str
  choices: [file, brain]
  default: file
  help: Where evidence is authoritative — the repository's receipts, or brain-v42 (shared, observed)
ticket:
  type: str
  default: ""
  help: brain-v42 delivery ticket UUID (red → project), created by the requester beforehand
  when: "{{ ledger == 'brain' }}"
  validator: >-
    {% if not (ticket | regex_search('^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$')) %}
    ticket must be a UUID
    {% endif %}
