[build-system]
requires = ["setuptools>=77.0"]  # PEP 639 license metadata
build-backend = "setuptools.build_meta"

[project]
name = "red-rail"
version = "0.6.0"
description = "Delivery rail for the ReD ecosystem: one standard, executable gates, measured drift"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "copier>=9.18",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]
# `ledger: brain` — the MCP client and, in tests, the in-memory fake brain (ADR-0002).
brain = [
    "fastmcp>=3.4,<4",  # the major the reference client (brain-v42 canary) runs on
]
# `rail reviewer` — the GitHub App client and the judges' runtime (ADR-0003).
reviewer = [
    "httpx>=0.27",
    "PyJWT[crypto]>=2.9",
    "headless-agents",
]

[tool.uv.sources]
headless-agents = { git = "https://github.com/hawkixs/brain-v42.git", tag = "headless-agents-v0.2.0", subdirectory = "packages/headless-agents" }

[project.scripts]
rail = "rail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rail.contracts" = ["*.json"]
"rail.reviewer" = ["guard.sh"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
