name: continuous-integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint, test, rail check
    # GitHub-hosted for the bootstrap; moving to [self-hosted, Linux, X64, red-ci] is a
    # red-runners registration (operator token), see docs/specs/2026-09-14-red-rail-design.md.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de

    steps:
      - name: Install git and curl (slim image)
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git curl ca-certificates >/dev/null

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Trust the workspace (container runs as root, the checkout belongs to the runner user)
        # actions/checkout writes `safe.directory` to a temporary global config that the later
        # steps never see; without this, git refuses the workspace and every history gate
        # (build.commits, integrate.receipt) reports "not a git repository".
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          checksum: "04f8b82f5d47f0512dcd32c67a4a6f16a0ea27c81537c338fd0ad6b23cebe829"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project dependencies
        run: uv sync --locked --extra dev

      - name: Install gitleaks (pinned, checksum verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          mkdir -p "$HOME/.local/bin"
          install -m 0755 /tmp/gitleaks "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: |
          uv run ruff check src/ tests/
          uv run ruff format --check src/ tests/

      - name: Test
        run: uv run pytest -q

      - name: Rail check (dogfooding, CI scope)
        run: uv run rail check --ci --json
