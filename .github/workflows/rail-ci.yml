name: rail-ci

# Reusable workflow: a project's `make ci`, then the rail gates in CI scope. Called by the
# template's continuous-integration.yml. CI never holds ledger credentials (spec §5): the
# gates are exposed as this check, attestations happen on the host.
on:
  workflow_call:
    inputs:
      stack:
        description: "python | go | rust | docs — must match rail.yaml"
        type: string
        required: true
      rail-ref:
        description: "Tag or branch of hawkixs/red-rail to install"
        type: string
        default: main
      runs-on:
        description: "Runner label as a JSON string, e.g. '[\"self-hosted\",\"Linux\",\"X64\",\"red-ci\"]'"
        type: string
        default: '"ubuntu-latest"'
    secrets:
      RAIL_READ_TOKEN:
        description: "Read token for hawkixs/red-rail while it is private (not needed once public)"
        required: false

permissions:
  contents: read

jobs:
  rail:
    name: make ci + rail check
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 20
    steps:
      - name: Check out the project (full history for the build gate and gitleaks)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check out red-rail
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: hawkixs/red-rail
          ref: ${{ inputs.rail-ref }}
          path: .rail
          token: ${{ secrets.RAIL_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          checksum: "04f8b82f5d47f0512dcd32c67a4a6f16a0ea27c81537c338fd0ad6b23cebe829"

      # Pinned rather than trusting the runner's preinstalled toolchain: an image ships
      # whatever version it happens to carry that week, which is not necessarily the one
      # go.mod declares, so an unpinned job does not build with the toolchain the project
      # asked for. Reproducibility is the reason; a missing toolchain is not — that claim
      # was made here without a measurement and has been withdrawn.
      #
      # The patch level is not cosmetic either: 1.26.5 carries stdlib advisories that
      # govulncheck reports as reachable from a serving path. How many depends on the code
      # being scanned, not on the version — two ReD repositories measured three and six
      # against the same release — so pin a patch where they are fixed rather than count.
      - name: Set up Go
        if: inputs.stack == 'go'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.8"
          check-latest: false
          # nothing to cache: the template ships no go.sum, and `make sync` is what writes
          # one. `cache: true` would only warn that it found no dependency file to key on.
          cache: false

      # Rust: rustup pinned by version and sha256, as gitleaks is below, and the toolchain read
      # from the project's own rust-toolchain.toml, the one pin, never repeated here. rustup is
      # called by absolute path: a $GITHUB_PATH write reaches later steps only. `component add`
      # acts on that file's toolchain; the bare `toolchain install` does not reliably add its
      # components (rustup #4216). The two --version calls fail setup, not lint, on a missing one.
      - name: Set up Rust (rustup pinned, checksum verified)
        if: inputs.stack == 'rust'
        env:
          RUSTUP_VERSION: "1.29.1"
          RUSTUP_INIT_SHA256: "dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71"
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/rustup-init "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
          echo "${RUSTUP_INIT_SHA256}  /tmp/rustup-init" | sha256sum -c -
          chmod 0755 /tmp/rustup-init
          /tmp/rustup-init -y --no-modify-path --profile minimal --default-toolchain none
          "$HOME/.cargo/bin/rustup" toolchain install
          "$HOME/.cargo/bin/rustup" component add rustfmt clippy
          $HOME/.cargo/bin/cargo fmt --version
          $HOME/.cargo/bin/cargo clippy --version
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Keyed on what decides the content: the toolchain, the lock, and the Makefile that pins
      # cargo-deny. target/ is not cached. A prefix restore is safe: `cargo install --version`
      # replaces an older cargo-deny, and `--locked` still judges the lock.
      - name: Cache the cargo registry and the pinned cargo-deny
        if: inputs.stack == 'rust'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            .cargo-tools
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Makefile') }}
          restore-keys: |
            rust-${{ runner.os }}-

      # A missing (uncommitted) or stale Cargo.lock fails here instead of being written.
      - name: Fetch against the committed lock, install cargo-deny
        if: inputs.stack == 'rust'
        run: make sync LOCKED=--locked

      - name: Install gitleaks (pinned, checksum verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          mkdir -p "$HOME/.local/bin"
          install -m 0755 /tmp/gitleaks "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install rail
        run: uv tool install ./.rail

      - name: Project CI (make ci, rail gates in CI scope)
        env:
          RAIL_FLAGS: --ci
        run: make ci

      - name: Rail check (machine-readable)
        run: rail check --ci --json
